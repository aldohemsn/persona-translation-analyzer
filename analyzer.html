<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Translation Analyzer (Offline)</title>
    <link rel="stylesheet" href="./assets/css/tailwind.min.css">
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

    <div id="app" class="app-grid p-4 sm:p-6">
        
        <header style="grid-area: header;" class="bg-white/80 backdrop-blur-lg border border-[var(--border-color)] rounded-xl shadow-sm p-4 sticky top-4 z-20">
            <div class="flex flex-wrap justify-between items-center gap-4">
                <h1 class="text-xl font-bold text-slate-800">Persona Translation Analyzer <span class="font-normal text-lg text-slate-400">v2.2.1-prod</span></h1>
                <div id="controls" class="flex items-center gap-2">
                    <button id="paste-json-btn" class="px-3 py-1.5 text-sm font-semibold bg-purple-500 text-white rounded-md hover:bg-purple-600 transition-default">Paste JSON</button>
                    <label for="file-upload" class="cursor-pointer px-3 py-1.5 text-sm font-semibold bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-default">Load File</label>
                    <input type="file" id="file-upload" class="hidden" accept=".json">
                </div>
            </div>
            <div id="stats-dashboard" class="mt-4 pt-4 border-t border-[var(--border-color)] grid grid-cols-1 sm:grid-cols-4 gap-4 hidden">
                 <h3 class="text-sm font-semibold text-slate-500 self-center hidden sm:block">FILTERS:</h3>
                 </div>
        </header>

        <main id="cases-list" style="grid-area: main;" class="pr-2 -mr-2">
            </main>

        <aside id="critique-panel" style="grid-area: aside;" class="bg-white border border-[var(--border-color)] rounded-xl shadow-sm flex flex-col transition-default">
            <div id="critique-content" class="h-full p-5">
                </div>
        </aside>

    </div>

    <div id="modal-paste" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden" role="dialog" aria-modal="true">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl p-6 animate-fade-in">
            <h3 class="text-lg font-bold text-purple-600">Paste JSON Content</h3>
            <p class="mt-1 text-sm text-slate-600">Paste the JSON content from the generator.</p>
            <textarea id="json-paste-area" class="w-full h-64 mt-4 p-2 border border-slate-300 rounded-md font-code text-sm focus:ring-purple-500 focus:border-purple-500"></textarea>
            <p id="paste-error-msg" class="text-red-600 text-sm mt-1 hidden"></p>
            <div class="mt-4 flex justify-end gap-2">
                <button id="modal-close-btn" class="px-4 py-2 text-sm font-semibold bg-slate-200 text-slate-700 rounded-md hover:bg-slate-300">Cancel</button>
                <button id="load-pasted-json-btn" class="px-4 py-2 text-sm font-semibold bg-purple-600 text-white rounded-md hover:bg-purple-700">Load Content</button>
            </div>
        </div>
    </div>
    
    <div id="toast-notification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white font-semibold py-2 px-5 rounded-full shadow-lg transition-transform duration-300 translate-y-20" role="alert">
        <p id="toast-message"></p>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- STATE MANAGEMENT ---
        let state = {
            cases: [],
            diagnosticsMap: new Map(),
            activeCaseId: null,
            activeDiagnosticId: null,
            activeFilter: null,
            toastTimeout: null,
        };

        // --- DOM ELEMENT CACHE ---
        const dom = {
            app: document.getElementById('app'),
            casesList: document.getElementById('cases-list'),
            critiquePanel: document.getElementById('critique-panel'),
            critiqueContent: document.getElementById('critique-content'),
            statsDashboard: document.getElementById('stats-dashboard'),
            fileUpload: document.getElementById('file-upload'),
            pasteJsonBtn: document.getElementById('paste-json-btn'),
            pasteModal: {
                container: document.getElementById('modal-paste'),
                closeBtn: document.getElementById('modal-close-btn'),
                loadBtn: document.getElementById('load-pasted-json-btn'),
                textArea: document.getElementById('json-paste-area'),
                errorMsg: document.getElementById('paste-error-msg'),
            },
            toast: {
                container: document.getElementById('toast-notification'),
                message: document.getElementById('toast-message'),
            }
        };

        // --- INITIALIZATION ---
        function init() {
            setupEventListeners();
            renderInitialState();
        }

        function setupEventListeners() {
            dom.fileUpload.addEventListener('change', e => handleFile(e.target.files[0]));
            
            // Modal listeners
            dom.pasteJsonBtn.addEventListener('click', () => toggleModal(true));
            dom.pasteModal.closeBtn.addEventListener('click', () => toggleModal(false));
            dom.pasteModal.container.addEventListener('click', (e) => { if (e.target === dom.pasteModal.container) toggleModal(false); });
            dom.pasteModal.loadBtn.addEventListener('click', handlePasteInput);

            // Main content listeners (delegated)
            dom.casesList.addEventListener('click', handleCaseListClick);
            dom.critiqueContent.addEventListener('click', handleCritiquePanelClick);
            dom.statsDashboard.addEventListener('click', handleFilterClick);
            
            // Drag and Drop
            const dropZone = dom.casesList;
            dropZone.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); e.currentTarget.querySelector('.drop-zone')?.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', e => { e.preventDefault(); e.stopPropagation(); e.currentTarget.querySelector('.drop-zone')?.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', e => {
                e.preventDefault(); e.stopPropagation();
                e.currentTarget.querySelector('.drop-zone')?.classList.remove('drag-over');
                handleFile(e.dataTransfer.files[0]);
            });
        }

        // --- UI RENDERING ---

        function renderInitialState() {
            dom.casesList.innerHTML = `
                <div class="drop-zone h-full flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-300 rounded-xl transition-default">
                    <svg class="w-16 h-16 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m.75 12 3 3m0 0 3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" /></svg>
                    <p class="mt-4 text-lg font-semibold text-slate-700">Start by loading your analysis file</p>
                    <p class="mt-1 text-slate-500">Drag & drop, click "Load File", or paste JSON content.</p>
                </div>`;
            dom.critiqueContent.innerHTML = `<div class="h-full flex items-center justify-center text-center text-slate-400"><p>Critique panel is waiting for data...</p></div>`;
            dom.statsDashboard.classList.add('hidden');
        }
        
        function renderAll() {
            renderCasesList();
            renderCritiquePanel();
            renderStatsDashboard();
            updateActiveStates();
        }

        function renderCasesList() {
            if (state.cases.length === 0) {
                renderInitialState();
                return;
            }
            const casesHtml = state.cases.map((caseData, index) => {
                const { html, mismatchCount } = annotateTranslation(caseData);
                const mismatchHtml = mismatchCount > 0 ? `<span class="text-xs font-medium text-amber-600" title="${mismatchCount} diagnostics had a 'target_phrase' that could not be matched.">${mismatchCount} unmatched</span>` : '';
                
                const diagnosticPersonas = new Set(caseData.diagnostics?.map(d => d.persona) || []);
                const dotsHtml = Array.from(diagnosticPersonas).map(persona => 
                    `<span class="diag-dot persona-${getPersonaClass(persona)} bg-persona" title="Focus on ${persona}" data-persona-focus="${persona}"></span>`
                ).join('');

                return `
                <div id="case-card-${caseData.id}" class="case-card scroll-margin bg-white border border-slate-200 rounded-xl shadow-sm mb-6 transition-default" data-case-id="${caseData.id}">
                    <div class="p-4 border-b border-slate-200 flex justify-between items-center cursor-pointer">
                        <div class="flex items-center gap-3">
                            <h2 class="font-bold text-slate-800">Case ${index + 1}</h2>
                            <div class="flex items-center gap-1.5">${dotsHtml}</div>
                        </div>
                        ${mismatchHtml}
                    </div>
                    <div class="p-4 md:p-5 space-y-6 text-slate-700 leading-relaxed">
                        <div>
                            <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Source</h3>
                            <p>${escapeHtml(caseData.sourceText || '')}</p>
                        </div>
                        <div>
                            <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Draft Translation</h3>
                            <p class="draft-text">${html}</p>
                        </div>
                        <div>
                            <h3 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Revised Text</h3>
                            <p class="text-slate-500">${escapeHtml(caseData.revisionText || '')}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
            dom.casesList.innerHTML = casesHtml;
        }
        
        function renderCritiquePanel() {
            const activeCase = state.cases.find(c => c.id === state.activeCaseId);
            if (!activeCase || !activeCase.diagnostics || activeCase.diagnostics.length === 0) {
                dom.critiqueContent.innerHTML = `<div class="h-full flex items-center justify-center text-center text-slate-400 p-4"><p>Select a case to view its critique, or this case has no diagnostics.</p></div>`;
                return;
            }

            const diagnosticsHtml = activeCase.diagnostics.map(diag => `
                <div class="diagnostic-card persona-${getPersonaClass(diag.persona)} border-l-4 p-4 rounded-r-lg bg-slate-50/50 mb-4 cursor-pointer transition-default border-persona animate-fade-in" data-diagnostic-id="${diag.id}">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-persona">${diag.persona}</h4>
                        <span class="text-xs font-semibold text-white bg-persona px-2 py-0.5 rounded-full">${diag.cause}</span>
                    </div>
                    <p class="text-sm text-slate-600">${renderMarkdown(diag.explanation)}</p>
                    <p class="mt-3 text-xs text-slate-400 font-code border-t border-slate-200 pt-2">Source phrase: ${escapeHtml(diag.original_phrase)}</p>
                </div>
            `).join('');
            dom.critiqueContent.innerHTML = diagnosticsHtml;
        }
        
        function renderStatsDashboard() {
            if (state.cases.length === 0) {
                dom.statsDashboard.classList.add('hidden');
                return;
            }
            const stats = { "The Analyst": 0, "The Architect": 0, "The Stylist": 0 };
            state.cases.forEach(c => c.diagnostics?.forEach(d => { if(stats.hasOwnProperty(d.persona)) stats[d.persona]++; }));

            const statsHtml = Object.entries(stats).map(([persona, count]) => {
                const personaClass = getPersonaClass(persona);
                return `
                <div class="stat-card persona-${personaClass} p-3 border-l-4 rounded-lg bg-slate-100/50 cursor-pointer transition-default border-persona" data-filter="${persona}">
                    <p class="text-sm font-semibold text-slate-500">${persona}</p>
                    <p class="text-2xl font-bold text-persona">${count}</p>
                </div>`;
            }).join('');
            dom.statsDashboard.innerHTML = `<h3 class="text-sm font-semibold text-slate-500 self-center hidden sm:block">FILTERS:</h3>` + statsHtml;
            dom.statsDashboard.classList.remove('hidden');
        }

        function updateActiveStates() {
            dom.app.classList.remove('filter-active-analyst', 'filter-active-architect', 'filter-active-stylist');
            if (state.activeFilter) {
                dom.app.classList.add(`filter-active-${getPersonaClass(state.activeFilter)}`);
            }

            document.querySelectorAll('.case-card').forEach(card => {
                card.classList.toggle('is-active', card.dataset.caseId === state.activeCaseId);
                const caseData = state.cases.find(c => c.id === card.dataset.caseId);
                let isFiltered = false;
                if (state.activeFilter) {
                    isFiltered = !caseData.diagnostics?.some(d => d.persona === state.activeFilter);
                }
                card.classList.toggle('is-filtered', isFiltered);
            });

            document.querySelectorAll('.diagnostic-highlight').forEach(span => {
                span.classList.toggle('is-active', span.dataset.diagnosticId === state.activeDiagnosticId);
            });

            document.querySelectorAll('.diagnostic-card').forEach(card => {
                card.classList.toggle('is-active', card.dataset.diagnosticId === state.activeDiagnosticId);
            });
            
            document.querySelectorAll('.stat-card').forEach(card => {
                card.classList.toggle('bg-slate-200', card.dataset.filter === state.activeFilter);
                card.classList.toggle('bg-slate-100/50', card.dataset.filter !== state.activeFilter);
            });
        }

        // --- EVENT HANDLERS ---
        function handleFile(file) {
            if (!file || !file.type.match('json.*')) {
                showToast('Please upload a valid JSON file.', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => processJsonData(e.target.result);
            reader.readAsText(file);
        }
        
        function handlePasteInput() {
            const jsonString = dom.pasteModal.textArea.value;
            if (processJsonData(jsonString)) {
                toggleModal(false);
            }
        }

        function handleCaseListClick(e) {
            const caseCard = e.target.closest('.case-card');
            if (!caseCard) return;

            const highlightSpan = e.target.closest('.diagnostic-highlight');
            const focusDot = e.target.closest('.diag-dot');

            // 1. Set active case
            state.activeCaseId = caseCard.dataset.caseId;
            // 2. Render its critique panel
            renderCritiquePanel();
            // 3. Reset active diagnostic
            state.activeDiagnosticId = null;

            // 4. Determine which specific element was clicked and update active diagnostic
            if (focusDot) {
                const personaToFocus = focusDot.dataset.personaFocus;
                const firstMatchingDiagnostic = state.cases
                    .find(c => c.id === state.activeCaseId)
                    ?.diagnostics?.find(d => d.persona === personaToFocus);
                if (firstMatchingDiagnostic) {
                    state.activeDiagnosticId = firstMatchingDiagnostic.id;
                }
            } else if (highlightSpan) {
                state.activeDiagnosticId = highlightSpan.dataset.diagnosticId;
            }

            // 5. Scroll to the active diagnostic card if there is one
            if (state.activeDiagnosticId) {
                // Use a timeout to ensure the DOM is ready after renderCritiquePanel
                setTimeout(() => {
                    const diagnosticCard = dom.critiqueContent.querySelector(`[data-diagnostic-id="${state.activeDiagnosticId}"]`);
                    diagnosticCard?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 50);
            }

            // 6. Update all UI states
            updateActiveStates();
        }

        function handleCritiquePanelClick(e) {
            const diagnosticCard = e.target.closest('.diagnostic-card');
            if (diagnosticCard) {
                state.activeDiagnosticId = diagnosticCard.dataset.diagnosticId;
                updateActiveStates();
                const highlightSpan = dom.casesList.querySelector(`[data-diagnostic-id="${state.activeDiagnosticId}"]`);
                highlightSpan?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
        
        function handleFilterClick(e) {
            const filterCard = e.target.closest('.stat-card');
            if (!filterCard) return;

            const newFilter = filterCard.dataset.filter;
            state.activeFilter = state.activeFilter === newFilter ? null : newFilter;

            if (state.activeFilter) {
                const firstMatchingCase = state.cases.find(c =>
                    c.diagnostics?.some(d => d.persona === state.activeFilter)
                );

                if (firstMatchingCase) {
                    state.activeCaseId = firstMatchingCase.id;
                    state.activeDiagnosticId = null;

                    const targetCard = document.getElementById(`case-card-${firstMatchingCase.id}`);
                    targetCard?.scrollIntoView({ behavior: 'smooth', block: 'start' });

                } else {
                    state.activeCaseId = null;
                    state.activeDiagnosticId = null;
                }
            }
            
            renderCritiquePanel();
            updateActiveStates();
        }

        // --- DATA PROCESSING ---
        function processJsonData(jsonString) {
            try {
                const cleanedString = jsonString.replace(/```json\s*([\s\S]*?)\s*```/g, '$1').trim();
                if (!cleanedString) throw new Error("Input is empty.");
                const data = JSON.parse(cleanedString);
                if (!data.cases || !Array.isArray(data.cases)) throw new Error("JSON must have a 'cases' array.");
                
                state.cases = data.cases;
                state.diagnosticsMap.clear();
                state.activeCaseId = data.cases.length > 0 ? data.cases[0].id : null;
                state.activeDiagnosticId = null;
                state.activeFilter = null;

                state.cases.forEach(caseData => {
                    (caseData.diagnostics || []).forEach((diag, index) => {
                        const uniqueId = `${caseData.id || crypto.randomUUID()}-diag-${index}`;
                        diag.id = uniqueId;
                        state.diagnosticsMap.set(uniqueId, diag);
                    });
                });

                renderAll();
                showToast(`Successfully loaded ${state.cases.length} cases.`);
                return true;
            } catch (error) {
                const errorMessage = `Invalid JSON. ${error.message}`;
                if (!dom.pasteModal.container.classList.contains('hidden')) {
                    dom.pasteModal.errorMsg.textContent = errorMessage;
                    dom.pasteModal.errorMsg.classList.remove('hidden');
                }
                showToast(errorMessage, 'error');
                return false;
            }
        }

        function annotateTranslation(caseData) {
            const text = caseData.translationText || '';
            const diagnostics = caseData.diagnostics || [];
            if (!text || diagnostics.length === 0) return { html: escapeHtml(text), mismatchCount: 0 };

            const annotations = diagnostics
                .map(diag => {
                    if (!diag.target_phrase) return null;
                    const startIndex = text.indexOf(diag.target_phrase);
                    if (startIndex === -1) return null;
                    return { ...diag, startIndex, endIndex: startIndex + diag.target_phrase.length };
                })
                .filter(Boolean)
                .sort((a,b) => a.startIndex - b.startIndex || (b.endIndex - b.startIndex) - (a.endIndex - a.startIndex));

            const mismatchCount = diagnostics.length - annotations.length;
            let lastIndex = 0;
            let htmlParts = [];
            
            annotations.forEach(anno => {
                if(anno.startIndex < lastIndex) return;
                htmlParts.push(escapeHtml(text.substring(lastIndex, anno.startIndex)));
                const personaClass = getPersonaClass(anno.persona);
                htmlParts.push(`<span class="diagnostic-highlight persona-${personaClass}" data-diagnostic-id="${anno.id}">${escapeHtml(text.substring(anno.startIndex, anno.endIndex))}</span>`);
                lastIndex = anno.endIndex;
            });
            htmlParts.push(escapeHtml(text.substring(lastIndex)));

            return { html: htmlParts.join(''), mismatchCount };
        }

        // --- UTILITIES ---
        function toggleModal(show) {
            if (show) {
                dom.pasteModal.textArea.value = '';
                dom.pasteModal.errorMsg.classList.add('hidden');
                dom.pasteModal.container.classList.remove('hidden');
            } else {
                dom.pasteModal.container.classList.add('hidden');
            }
        }

        function showToast(message, type = 'success') {
            dom.toast.message.textContent = message;
            dom.toast.container.classList.toggle('bg-red-600', type === 'error');
            dom.toast.container.classList.toggle('bg-slate-900', type !== 'error');
            dom.toast.container.classList.remove('translate-y-20');
            clearTimeout(state.toastTimeout);
            state.toastTimeout = setTimeout(() => {
                dom.toast.container.classList.add('translate-y-20');
            }, 3000);
        }
        
        function getPersonaClass(persona) {
            if (persona === "The Analyst") return "analyst";
            if (persona === "The Architect") return "architect";
            if (persona === "The Stylist") return "stylist";
            return "default";
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function renderMarkdown(text) {
            if (typeof text !== 'string') return '';
            let safeText = escapeHtml(text);
            return safeText
                .replace(/`(.*?)`/g, '<code class="font-code text-sm bg-slate-200/50 text-slate-800 px-1 py-0.5 rounded">$1</code>');
        }

        // --- START THE APP ---
        init();
    });
    </script>
</body>
</html>
