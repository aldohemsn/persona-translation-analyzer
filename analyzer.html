<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Translation Analyzer (Offline)</title>
    <link rel="stylesheet" href="./assets/css/tailwind.min.css">
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <style>
        /* This block contains all custom application styles. For production, this can be externalized to a styles.css file. */
        :root {
            --analyst-color: 99 102 241; /* indigo-500 */
            --architect-color: 234 179 8; /* yellow-500 */
            --stylist-color: 236 72 153; /* pink-500 */
            --bg-color: #111827; /* gray-900 */
            --panel-color: #1f2937; /* gray-800 */
            --text-color: #d1d5db; /* gray-300 */
            --border-color: #374151; /* gray-700 */
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }
        .font-noto {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
        }
        mark {
            padding: 2px 4px;
            border-radius: 4px;
            color: white;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        mark.analyst { background-color: rgba(var(--analyst-color), 0.7); }
        mark.architect { background-color: rgba(var(--architect-color), 0.7); }
        mark.stylist { background-color: rgba(var(--stylist-color), 0.7); }
        
        .linked-highlight {
            outline: 2px solid #facc15; /* yellow-400 */
            box-shadow: 0 0 10px 3px rgba(250, 204, 21, 0.5);
            border-radius: 4px;
            transition: outline 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        mark.linked-highlight {
            filter: brightness(1.5);
        }

        /* Filter styles */
        .filter-btn {
            transition: all 0.2s ease-in-out;
        }
        .filter-btn.active.analyst { background-color: rgb(var(--analyst-color)); color: white; }
        .filter-btn.active.architect { background-color: rgb(var(--architect-color)); color: #111827; }
        .filter-btn.active.stylist { background-color: rgb(var(--stylist-color)); color: white; }

        body.filter-analyst mark:not(.analyst),
        body.filter-architect mark:not(.architect),
        body.filter-stylist mark:not(.stylist) {
            background-color: transparent;
            color: inherit;
            padding: 0;
            outline: 1px dashed var(--border-color);
        }

        /* Collapsible Source Styles */
        .source-content {
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out;
        }
        .source-toggle-icon.collapsed {
            transform: rotate(-90deg);
        }
        .source-content.collapsed {
             max-height: 0 !important;
             padding-top: 0 !important;
             padding-bottom: 0 !important;
             margin-top: 0 !important;
        }


        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="overflow-hidden">

    <!-- Main Container -->
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="flex-shrink-0 bg-gray-900/80 backdrop-blur-sm border-b border-gray-700 p-3 flex items-center justify-between z-20">
            <!-- Left: Title -->
            <div class="flex-shrink-0">
                <h1 class="text-lg font-bold text-white">Persona Translation Analyzer</h1>
            </div>
            <!-- Center: Filters -->
            <div id="filter-controls" class="flex-grow flex items-center justify-center space-x-2 md:space-x-3 px-4 hidden">
                <button data-persona="analyst" class="filter-btn analyst px-3 py-1 text-sm font-semibold rounded-full border border-indigo-500 text-indigo-400 hover:bg-indigo-500 hover:text-white">Analyst</button>
                <button data-persona="architect" class="filter-btn architect px-3 py-1 text-sm font-semibold rounded-full border border-yellow-500 text-yellow-400 hover:bg-yellow-500 hover:text-gray-900">Architect</button>
                <button data-persona="stylist" class="filter-btn stylist px-3 py-1 text-sm font-semibold rounded-full border border-pink-500 text-pink-400 hover:bg-pink-500 hover:text-white">Stylist</button>
            </div>
            <!-- Right: Actions -->
            <div class="flex-shrink-0 flex items-center space-x-3">
                <input type="file" id="file-input" class="hidden">
                <button id="load-file-btn" class="px-3 py-2 text-sm bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors">Load File</button>
                <button id="paste-json-btn" class="px-3 py-2 text-sm bg-gray-600 text-white rounded-md hover:bg-gray-700 transition-colors">Paste JSON</button>
            </div>
        </header>

        <!-- Main Content: Single Scrollable Report -->
        <main id="report-container" class="flex-grow overflow-y-auto p-4">
            <div id="welcome-message" class="text-center text-gray-400 p-8">
                <p class="text-lg">No data loaded.</p>
                <p class="mt-2 text-sm">Use the buttons in the header to load your analysis file.</p>
            </div>
        </main>
    </div>

    <!-- Modal for Pasting JSON -->
    <div id="json-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-2xl">
            <h2 class="text-lg font-bold mb-4">Paste JSON Data</h2>
            <textarea id="json-textarea" class="w-full h-64 bg-gray-900 text-gray-300 p-2 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <div class="mt-4 flex justify-end space-x-3">
                <button id="cancel-paste-btn" class="px-4 py-2 bg-gray-600 rounded-md hover:bg-gray-700">Cancel</button>
                <button id="submit-paste-btn" class="px-4 py-2 bg-indigo-600 rounded-md hover:bg-indigo-700">Load Data</button>
            </div>
        </div>
    </div>


    <script>
        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const loadFileBtn = document.getElementById('load-file-btn');
        const pasteJsonBtn = document.getElementById('paste-json-btn');
        const reportContainer = document.getElementById('report-container');
        const welcomeMessage = document.getElementById('welcome-message');
        const jsonModal = document.getElementById('json-modal');
        const jsonTextarea = document.getElementById('json-textarea');
        const cancelPasteBtn = document.getElementById('cancel-paste-btn');
        const submitPasteBtn = document.getElementById('submit-paste-btn');
        const filterControls = document.getElementById('filter-controls');

        let analysisData = [];

        // --- Event Listeners ---
        loadFileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileLoad);
        pasteJsonBtn.addEventListener('click', () => jsonModal.classList.remove('hidden'));
        cancelPasteBtn.addEventListener('click', () => jsonModal.classList.add('hidden'));
        submitPasteBtn.addEventListener('click', handlePasteSubmit);
        filterControls.addEventListener('click', handleFilterClick);

        // --- Data Handling and Rendering ---
        
        function renderMarkdown(text) {
            if (!text) return '';
            let safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return safeText
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                .replace(/&lt;mark/g, '<mark').replace(/&lt;\/mark&gt;/g, '</mark>')
                .replace(/&gt;/g, '>');
        }

        function handleFileLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    processAndRenderData(data);
                } catch (error) {
                    alert('Error parsing JSON file. Please check the file format.');
                    console.error('JSON Parse Error:', error);
                }
            };
            reader.readAsText(file);
        }

        function handlePasteSubmit() {
            const jsonString = jsonTextarea.value;
            if (!jsonString) return;
            try {
                const data = JSON.parse(jsonString);
                processAndRenderData(data);
                jsonTextarea.value = '';
                jsonModal.classList.add('hidden');
            } catch (error) {
                alert('Error parsing pasted JSON. Please check the format.');
                console.error('JSON Parse Error:', error);
            }
        }

        function processAndRenderData(data) {
            analysisData = data;
            welcomeMessage.classList.add('hidden');
            filterControls.classList.remove('hidden');
            reportContainer.innerHTML = ''; // Clear previous content
            analysisData.forEach(caseData => {
                const caseElement = createCaseElement(caseData);
                reportContainer.appendChild(caseElement);
            });
        }

        function createCaseElement(caseData) {
            const element = document.createElement('div');
            element.id = `case-${caseData.case_id}`;
            element.className = 'border border-gray-700 bg-gray-800/50 rounded-lg mb-4 p-4 transition-all duration-300';
            
            const personasInCase = [...new Set(caseData.diagnostics.map(d => d.persona.toLowerCase()))];
            
            const sourceHTML = renderMarkdown(highlightText(caseData.source, caseData, 'source'));
            const draftHTML = renderMarkdown(highlightText(caseData.draft, caseData, 'draft'));
            const revisionHTML = renderMarkdown(highlightText(caseData.revision, caseData, 'revision'));

            element.innerHTML = `
                <header class="flex justify-between items-center pb-3 border-b border-gray-700">
                    <h2 class="text-lg font-bold text-white">${caseData.case_id}</h2>
                    <div class="flex space-x-2" title="Personas identified in this case">
                        ${personasInCase.includes('analyst') ? '<div class="w-3 h-3 bg-indigo-500 rounded-full"></div>' : ''}
                        ${personasInCase.includes('architect') ? '<div class="w-3 h-3 bg-yellow-500 rounded-full"></div>' : ''}
                        ${personasInCase.includes('stylist') ? '<div class="w-3 h-3 bg-pink-500 rounded-full"></div>' : ''}
                    </div>
                </header>

                <div class="source-container mt-4">
                    <div class="source-header flex justify-between items-center cursor-pointer p-2 -mx-2 rounded-md hover:bg-gray-700/50">
                        <h3 class="font-semibold text-gray-400">Source Text</h3>
                        <svg class="source-toggle-icon w-5 h-5 text-gray-400 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="source-content">
                        <div class="source-text font-noto p-3 bg-gray-900/50 rounded-md mt-2">${sourceHTML}</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4 text-base leading-relaxed mt-4">
                    <div>
                        <h3 class="font-semibold text-gray-400 mb-2">Draft</h3>
                        <div class="draft-text font-noto p-3 bg-gray-900/50 rounded-md">${draftHTML}</div>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-400 mb-2">Revision</h3>
                        <div class="revision-text font-noto p-3 bg-gray-900/50 rounded-md">${revisionHTML}</div>
                    </div>
                </div>
            `;
            
            const sourceContent = element.querySelector('.source-content');
            sourceContent.style.maxHeight = sourceContent.scrollHeight + 'px';

            const sourceHeader = element.querySelector('.source-header');
            const sourceIcon = element.querySelector('.source-toggle-icon');
            sourceHeader.addEventListener('click', (e) => {
                e.stopPropagation();
                sourceContent.classList.toggle('collapsed');
                sourceIcon.classList.toggle('collapsed');
                if (!sourceContent.classList.contains('collapsed')) {
                     sourceContent.style.maxHeight = sourceContent.scrollHeight + 'px';
                }
            });

            element.querySelectorAll('.source-text mark, .draft-text mark, .revision-text mark').forEach(mark => {
                mark.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const caseId = e.target.dataset.caseId;
                    const diagIndex = e.target.dataset.diagnosticIndex;
                    syncHighlights(caseId, diagIndex);
                });
            });

            return element;
        }

        function highlightText(text, caseData, type) {
            let highlightedText = text;
            const sortedDiagnostics = caseData.diagnostics
                .map((diag, index) => ({...diag, originalIndex: index}))
                .sort((a, b) => {
                    const segmentA = a[`${type}_segment`];
                    const segmentB = b[`${type}_segment`];
                    return (segmentB?.length || 0) - (segmentA?.length || 0);
                });

            sortedDiagnostics.forEach(diag => {
                const segment = diag[`${type}_segment`];
                if (!segment) return;
                
                const personaClass = diag.persona.toLowerCase();
                const dataAttrs = `data-case-id="${caseData.case_id}" data-diagnostic-index="${diag.originalIndex}"`;
                const replacementHtml = `<mark class="${personaClass}" ${dataAttrs}>${segment}</mark>`;
                
                const regex = new RegExp(segment.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '(?![^<]*>|[^<>]*</mark>)', 'g');
                highlightedText = highlightedText.replace(regex, replacementHtml);
            });
            return highlightedText;
        }
        
        function syncHighlights(caseId, diagnosticIndex) {
            document.querySelectorAll('.linked-highlight').forEach(el => el.classList.remove('linked-highlight'));

            const caseElement = document.getElementById(`case-${caseId}`);
            if (!caseElement || diagnosticIndex === null) return;

            const sourceMark = caseElement.querySelector(`.source-text mark[data-diagnostic-index="${diagnosticIndex}"]`);
            const draftMark = caseElement.querySelector(`.draft-text mark[data-diagnostic-index="${diagnosticIndex}"]`);
            const revisionMark = caseElement.querySelector(`.revision-text mark[data-diagnostic-index="${diagnosticIndex}"]`);

            sourceMark?.classList.add('linked-highlight');
            draftMark?.classList.add('linked-highlight');
            revisionMark?.classList.add('linked-highlight');

            if (draftMark) {
                draftMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (sourceMark) {
                sourceMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function handleFilterClick(event) {
            const button = event.target.closest('.filter-btn');
            if (!button) return;

            const persona = button.dataset.persona;
            const body = document.body;
            const filterClass = `filter-${persona}`;

            if (button.classList.contains('active')) {
                button.classList.remove('active');
                body.classList.remove(filterClass);
            } else {
                filterControls.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    body.classList.remove(`filter-${btn.dataset.persona}`);
                });
                button.classList.add('active');
                body.classList.add(filterClass);
            }
        }
    </script>
</body>
</html>
